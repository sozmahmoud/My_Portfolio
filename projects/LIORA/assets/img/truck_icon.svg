<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48">
  <!-- Cute Flower Delivery Truck -->
  <defs>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8ab3"/>
      <stop offset="100%" style="stop-color:#e83e7c"/>
    </linearGradient>
    <linearGradient id="truckCabin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb3d1"/>
      <stop offset="100%" style="stop-color:#ff6fa5"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7ff"/>
      <stop offset="100%" style="stop-color:#b3e5fc"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="32" cy="45" rx="28" ry="3" fill="rgba(0,0,0,0.1)"/>

  <!-- Truck Body -->
  <rect x="2" y="12" width="38" height="26" rx="6" fill="url(#truckBody)"/>

  <!-- Flower decoration on truck -->
  <circle cx="12" cy="22" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="12" cy="22" r="3" fill="#ff8ab3"/>
  <circle cx="12" cy="22" r="1.5" fill="#ffd700"/>

  <circle cx="22" cy="20" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="22" cy="20" r="2.5" fill="#c1e1c1"/>
  <circle cx="22" cy="20" r="1.2" fill="#ffd700"/>

  <circle cx="30" cy="24" r="4.5" fill="#fff" opacity="0.9"/>
  <circle cx="30" cy="24" r="2.8" fill="#e1bee7"/>
  <circle cx="30" cy="24" r="1.3" fill="#ffd700"/>

  <!-- Cabin -->
  <path d="M40 18 L52 18 Q58 18 60 24 L62 32 L62 38 L40 38 Z" fill="url(#truckCabin)"/>

  <!-- Window -->
  <path d="M42 20 L50 20 Q54 20 55 24 L56 30 L42 30 Z" fill="url(#window)" opacity="0.85"/>

  <!-- Headlight -->
  <circle cx="60" cy="34" r="2.5" fill="#fff9c4"/>
  <circle cx="60" cy="34" r="1.5" fill="#fff"/>

  <!-- Wheels -->
  <circle cx="14" cy="40" r="7" fill="#5d3a4a"/>
  <circle cx="14" cy="40" r="4" fill="#fff0f7"/>
  <circle cx="14" cy="40" r="2" fill="#e83e7c"/>

  <circle cx="50" cy="40" r="7" fill="#5d3a4a"/>
  <circle cx="50" cy="40" r="4" fill="#fff0f7"/>
  <circle cx="50" cy="40" r="2" fill="#e83e7c"/>

  <!-- Cute hearts floating -->
  <path d="M34 8 Q35 6 36 8 Q37 6 38 8 Q38 10 36 12 Q34 10 34 8" fill="#ff8ab3" opacity="0.8"/>
  <path d="M8 6 Q9 4 10 6 Q11 4 12 6 Q12 8 10 10 Q8 8 8 6" fill="#ffb3d1" opacity="0.6"/>
</svg>