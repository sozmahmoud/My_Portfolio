<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:#141B2E;
      --paper:#EEF1EA;
      --panel:#F8F9F4;
      --line:#D9DCD1;
      --text:#232A3B;
      --text-soft:#5B6373;
      --gold:#B9853A;
      --gold-soft:#EADFC4;
      --teal:#2F7A6D;
      --teal-soft:#DCEAE6;
      --shadow: 0 18px 40px rgba(17, 26, 38, 0.08);
      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.7;
    }

    .page-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px 70px;
      background: var(--paper);
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .back-link,
    .repo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 1px solid var(--line);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: transform .15s ease;
      border-radius: 0;
    }
    .back-link { color: var(--text); background: rgba(255,255,255,0.02); }
    .repo-link {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }
    .back-link:hover, .repo-link:hover { transform: translateY(-1px); }

    .project-detail {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(47,122,109,0.12), rgba(184,133,58,0.08));
    }

    .detail-visual {
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
    }
    .detail-visual::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      pointer-events: none;
    }
    .gallery-shell {
      width: min(100%, 720px);
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 14px;
    }
    .gallery-stage {
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      min-height: 330px;
      max-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .gallery-stage img {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
      background: rgba(255,255,255,0.96);
      cursor: pointer;
    }
    .project-preview-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(8, 12, 16, 0.72);
      backdrop-filter: blur(4px);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .project-preview-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .project-preview-modal {
      position: relative;
      width: min(92vw, 760px);
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 28px 68px rgba(7, 11, 16, 0.38);
      transform: translateY(18px) scale(.98);
      transition: transform .2s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 18px 18px;
    }
    .project-preview-overlay.active .project-preview-modal {
      transform: translateY(0) scale(1);
    }
    .project-preview-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      z-index: 1;
    }
    .project-preview-nav {
      position: static;
      transform: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: var(--text);
      font-size: 26px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1;
      box-shadow: 0 10px 28px rgba(17,26,38,0.08);
      flex-shrink: 0;
    }
    .project-preview-frame {
      flex: 1;
      max-height: 78vh;
      overflow: auto;
      background: linear-gradient(135deg, rgba(47,122,109,0.08), rgba(184,133,58,0.08));
    }
    .project-preview-frame img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      object-fit: contain;
      background: rgba(255,255,255,0.96);
      margin: 0 auto;
    }
    .gallery-arrow {
      width: 52px;
      height: 52px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      color: var(--ink);
      font-size: 28px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 10px 20px rgba(17,26,38,0.08);
    }
    .gallery-arrow:hover {
      background: white;
      transform: translateY(-1px);
    }
    .gallery-arrow:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .gallery-meta {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 700;
    }

    .detail-content {
      padding: 36px 30px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .project-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      font-weight: 600;
      line-height: 1.08;
      color: var(--text);
    }
    .project-subtitle {
      margin: 12px 0 18px;
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-soft);
    }

    .tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 24px;
    }
    .tech-list span {
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 7px 10px;
      border: 1px solid rgba(47,122,109,0.12);
      border-radius: 999px;
    }

    .summary-block {
      margin-top: 4px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }
    .summary-block h3,
    .readme-block h3,
    .story-panel h3 {
      margin: 0 0 12px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 700;
    }
    .summary-block p {
      margin: 0;
      font-size: 15px;
      color: var(--text-soft);
      line-height: 1.8;
    }

    .readme-block {
      padding: 30px 28px 34px;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }
    .readme-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
      background: transparent;
    }
    .story-panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      padding: 22px 20px;
    }
    .story-panel p,
    .story-panel li {
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.8;
      margin: 0 0 12px;
    }
    .story-panel ul {
      margin: 0;
      padding-left: 18px;
    }
    .story-panel strong { color: var(--text); }

    @media (max-width: 900px) {
      .detail-hero { grid-template-columns: 1fr; }
      .detail-visual { min-height: 260px; }
      .readme-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-shell">

              <li>Focused on business value, user experience, and analytical clarity instead of only technical output.</li>
              <li>Designed the project to be easy to present, explain, and share in a professional portfolio environment.</li>
            </ul>
          </div>
          <div class="story-panel" style="grid-column: 1 / -1;">
            <h3>What I did</h3>
            ${readmeItems}
          </div>
        </div>
      </div>
    `;

    const galleryImage = document.querySelector('.gallery-image');
    const galleryMeta = document.querySelector('.gallery-meta');
    const galleryButtons = document.querySelectorAll('.gallery-arrow');
    const projectPreviewOverlay = document.getElementById('projectPreviewOverlay');
    const projectPreviewImage = document.getElementById('projectPreviewImage');
    const projectPreviewClose = document.querySelector('.project-preview-close');
    const projectPreviewPrev = document.querySelector('.project-preview-prev');
    const projectPreviewNext = document.querySelector('.project-preview-next');

    let currentIndex = 0;

    const syncPreviewNavigation = () => {
      if (projectPreviewPrev) {
        projectPreviewPrev.style.display = images.length > 1 ? 'flex' : 'none';
      }
      if (projectPreviewNext) {
        projectPreviewNext.style.display = images.length > 1 ? 'flex' : 'none';
      }
    };

    const openProjectPreview = (src, alt) => {
      if (!projectPreviewOverlay || !projectPreviewImage) return;
      projectPreviewImage.src = src;
      projectPreviewImage.alt = alt;
      projectPreviewOverlay.classList.add('active');
      projectPreviewOverlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      syncPreviewNavigation();
    };

    const closeProjectPreview = () => {
      if (!projectPreviewOverlay) return;
      projectPreviewOverlay.classList.remove('active');
      projectPreviewOverlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    };

    const updateGallery = () => {
      if (!galleryImage) return;
      galleryImage.src = images[currentIndex];
      galleryImage.alt = `${project.title} preview image ${currentIndex + 1}`;
      if (galleryMeta) {
        galleryMeta.textContent = `${currentIndex + 1} / ${images.length}`;
      }
      if (projectPreviewOverlay.classList.contains('active') && projectPreviewImage) {
        projectPreviewImage.src = images[currentIndex];
        projectPreviewImage.alt = `${project.title} preview image ${currentIndex + 1}`;
      }
    };

    if (galleryImage) {
      galleryImage.addEventListener('click', () => {
        openProjectPreview(images[currentIndex], `${project.title} preview image ${currentIndex + 1}`);
      });
    }

    if (galleryButtons.length) {
      galleryButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const direction = button.dataset.direction === 'next' ? 1 : -1;
          currentIndex = (currentIndex + direction + images.length) % images.length;
          updateGallery();
        });
      });
    }

    if (projectPreviewPrev) {
      projectPreviewPrev.addEventListener('click', () => {
        if (images.length <= 1) return;
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateGallery();
      });
    }

    if (projectPreviewNext) {
      projectPreviewNext.addEventListener('click', () => {
        if (images.length <= 1) return;
        currentIndex = (currentIndex + 1) % images.length;
        updateGallery();
      });
    }

    if (projectPreviewClose) {
      projectPreviewClose.addEventListener('click', closeProjectPreview);
    }

    if (projectPreviewOverlay) {
      projectPreviewOverlay.addEventListener('click', (event) => {
        if (event.target === projectPreviewOverlay) {
          closeProjectPreview();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && projectPreviewOverlay.classList.contains('active')) {
          closeProjectPreview();
        }
        if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && projectPreviewOverlay.classList.contains('active') && images.length > 1) {
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          currentIndex = (currentIndex + direction + images.length) % images.length;
          updateGallery();
        }
      });
    }

    syncPreviewNavigation();

    const repoLink = document.getElementById('repoLink');
    repoLink.href = project.live ? project.live : project.repo;
    repoLink.target = '_blank';
    repoLink.rel = 'noopener noreferrer';
    repoLink.textContent = project.live ? 'Visit live website' : 'View GitHub repository';
  </script>
</body>
</html>
